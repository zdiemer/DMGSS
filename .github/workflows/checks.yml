name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmp AGENTS.md CLAUDE.md
      - run: git diff --check
      - name: Reject plaintext deployment values
        run: test -z "$(git ls-files '*values.local.yaml')"
  browser:
    name: browser (${{ matrix.project }}, ${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, chromium-mobile, webkit-mobile]
        suite: [compute, continuation]
        # Group by measured work: default file sharding puts all slow suites
        # together. New spec files automatically join continuation.
        include:
          - suite: compute
            file_filter: '(^|/)(cpu|conformance|portable)\.spec\.js$'
          - suite: continuation
            file_filter: '(^|/)(?!(cpu|conformance|portable)\.spec\.js$)[^/]+\.spec\.js$'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: sudo apt-get install -y shared-mime-info
      - run: npx playwright test --project=${{ matrix.project }} '${{ matrix.file_filter }}'
  converter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.1
      - run: helm lint .
      - run: helm template dmgss . > /dev/null
      - run: bash -n build.sh upgrade.sh
