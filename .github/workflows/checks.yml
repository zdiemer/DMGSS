name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmp AGENTS.md CLAUDE.md
      - run: git diff --check
      - name: Reject plaintext deployment values
        run: test -z "$(git ls-files '*values.local.yaml')"
  browser:
    name: browser (${{ matrix.project }}, ${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, chromium-mobile, webkit-mobile]
        suite: [compute, automatic, checkpoint, integration]
        # Manual transfers alone can take 26 minutes on shared runners. Keep
        # each retention file independent; every new spec joins integration.
        include:
          - suite: compute
            file_filter: '(^|/)(cpu|conformance|portable)\.spec\.js$'
          - suite: automatic
            file_filter: '(^|/)automatic\.spec\.js$'
          - suite: checkpoint
            file_filter: '(^|/)checkpoint\.spec\.js$'
          - suite: integration
            file_filter: '(^|/)(?!(cpu|conformance|portable|automatic|checkpoint)\.spec\.js$)[^/]+\.spec\.js$'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: npm ci
      # EC2's regional mirror took over 30 minutes on two runners while the
      # same image installed in under a minute elsewhere. Use the main mirror.
      - name: Normalize Ubuntu package mirror
        run: sudo sed -i -E 's|https?://[a-z0-9.-]+\.ec2\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
      - run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 10
      - run: sudo apt-get install -y shared-mime-info
      - run: npx playwright test --reporter=list --project=${{ matrix.project }} '${{ matrix.file_filter }}'
  converter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.1
      - run: helm lint .
      - run: helm template dmgss . > /dev/null
      - run: bash -n build.sh upgrade.sh
