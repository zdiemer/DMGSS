name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmp AGENTS.md CLAUDE.md
      - run: git diff --check
      - name: Reject plaintext deployment values
        run: test -z "$(git ls-files '*values.local.yaml')"
