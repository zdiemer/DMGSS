map $uri $form_action {
  default "'none'";
  ~^/convert/ "'self'";
}
map $uri $referrer_policy {
  default no-referrer;
  ~^/convert/ same-origin;
}
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'none'; connect-src 'none'; base-uri 'none'; form-action $form_action; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy $referrer_policy always;
  add_header Cache-Control "no-cache" always;
  location = /healthz { access_log off; return 200 "ok\n"; }
  location /convert/ {
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    proxy_request_buffering on;
    proxy_max_temp_file_size 0;
    proxy_set_header Host $http_host;
    proxy_pass http://127.0.0.1:8090;
  }
  location / { try_files $uri $uri/ =404; }
}
